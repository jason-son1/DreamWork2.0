# 스킬 설정
skills:
  sensitivity:
    name: "입질 감지"
    unlock-level: 10
    description: "낚시 대기 시간이 감소합니다."
    wait_reduction: 0.2  # 20% 감소
    
  live_fish:
    name: "살아있는 손"
    unlock-level: 25
    description: "물고기를 살아있는 채로 잡아 납품 가격이 증가합니다."
    live_chance: 0.3  # 30% 확률로 살아있는 물고기
    
  big_catch:
    name: "대어 낚시"
    unlock-level: 50
    description: "더 큰 물고기를 낚을 확률이 증가합니다."
    size_bonus: 20  # 최대 크기 +20cm

# 날씨/바이옴 보너스
