# 농부 (Farmer) 설정 파일
# Plan/직업/농부 변경.md 및 세부 테이블.md 기반

level-up-curve: "level * 100 + 50"

# 1. 경험치 및 보상 테이블
# 대상: [경험치, 돈]
# * 중요: 완전히 자란 작물(Fully Grown)만 보상 지급
rewards:
  # Tier 1 (기초 작물)
  wheat:
    exp: 1.0
    money: 0.5
  potato:
    exp: 1.0
    money: 0.5
  carrot:
    exp: 1.0
    money: 0.5
  beetroots:
    exp: 1.0
    money: 0.5
    
  # Tier 1.5 (빠른 성장)
  sugar_cane:
    exp: 1.0
    money: 0.5
  cactus:
    exp: 1.0
    money: 0.5
    
  # Tier 2 (자동화 고려)
  pumpkin:
    exp: 1.5
    money: 0.8
  melon:
    exp: 1.5
    money: 0.8
    
  # Tier 3 (고수익)
  nether_wart:
    exp: 3.0
    money: 2.0
  cocoa:
    exp: 3.0
    money: 2.0

  # Special
  golden_crop:
    exp: 50.0
    money: 100.0

# 2. 스킬 설정
skills:
  # 패시브: 녹색 손길 (Green Thumb) - 자동 재파종
  green_thumb:
    name: "녹색 손길"
    levels:
      10:
        chance: 50.0 # 50%
      30:
        chance: 100.0 # 100%

  # 패시브: 대지의 기운 (Growth Aura) - 주변 작물 성장 가속
  growth_aura:
    name: "대지의 기운"
    interval: 200 # 10초마다 체크 (Ticks)
    levels:
      20:
        radius: 3
        chance: 0.05 # 5% 확률로 성장
      50:
        radius: 5
        chance: 0.10 # 10%
      100: # Max
        radius: 7
        chance: 0.20 # 20%

# 3. 아이템 및 확률 설정
items:
  # 황금 씨앗 (완전히 자란 작물 수확 시 드롭)
  golden_seed:
    base_chance: 0.001 # 0.1%
    bonus_per_level: 0.0005 # 레벨당 0.05%
    drop_from: 
      - WHEAT
      - CARROT # POTATO, BEETROOTS handled in code
      
  # 작물 등급 (Quality Crops)
  quality_crops:
    tier_2_chance: 0.15 # 2성 (15%)
    tier_3_chance: 0.05 # 3성 (5%)
    tier_1_prefix: "§f"
    tier_2_prefix: "§a싱싱한 "
    tier_3_prefix: "§6 황금/유기농 "

  # 비료
  fertilizers:
    quick_gro:
      duration: 600 # 10분
      speed_multiplier: 2
    quality_compost:
      tier_2_bonus: 0.2 # +20%
      tier_3_bonus: 0.1 # +10%
