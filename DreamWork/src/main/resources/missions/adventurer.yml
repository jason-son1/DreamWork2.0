chains:
  # 1. 공백을 채우는 자 (Map Maker)
  map_maker:
    icon: MAP
    tier_1:
      display_name: "&e[측량] &f하얀 종이 위의 첫 발"
      description:
        - "&7지도를 제작하고 세상을 담으세요."
      type: CRAFT
      target: MAP
      amount: 5
      rewards:
        - "give %player% experience_bottle 5"
        - "give %player% paper 32"
        - "give %player% leather 5"
      next_mission: map_maker_tier_2
    tier_2:
      display_name: "&e[측량] &f격자무늬의 세계"
      description:
        - "&7인접한 지역의 지도를 완성하여 큰 지도를 만드세요."
      type: CUSTOM_CHECK
      conditions:
        - "MAP_GRID: 2x2"
      amount: 1
      rewards:
        - "money give %player% 500"
        - "give %player% cartography_table 1"
    tier_3:
      display_name: "&e[측량] &6국토지리정보원"
      description:
        - "&7중요 지점에 마커를 표시하세요."
      type: CUSTOM_CHECK
      conditions:
        - "MAP_MARKERS: 3"
      amount: 1
      rewards:
        - "lp user %player% parent add title_surveyor"
        - "dw item give %player% sturdy_compass 1"

  # 2. 지평선의 방랑자 (The Walker)
  the_walker:
    icon: LEATHER_BOOTS
    tier_1:
      display_name: "&e[탐험] &f평원의 개척자"
      description:
        - "&7평원이나 숲을 누비세요."
        - "&f목표: &e2000 블록 이동"
      type: WALK
      target: 
        - PLAINS
        - FOREST
        - FLOWER_FOREST
      amount: 2000
      rewards:
        - "give %player% experience_bottle 5"
        - "give %player% bread 16"
      next_mission: the_walker_tier_2
    tier_2:
      display_name: "&e[탐험] &c극한 환경 훈련"
      description:
        - "&7사막의 더위와 설원의 추위를 극복하세요."
      type: WALK
      target: 
        - DESERT
        - SNOWY_PLAINS
      amount: 1000 # Each or total? Listener will accumulate walk if biome matches one of targets
      rewards:
        - "money give %player% 1000"
        - "dw item give %player% light_boots 1"
    tier_3:
      display_name: "&e[탐험] &b수직의 한계"
      description:
        - "&7가장 높고 낮은 곳에 발자국을 남기세요."
      type: WALK
      target: ANY
      amount: 100 # Just walk distance, but condition checks Y
      conditions:
        - "Y_ABOVE: 200"
        - "Y_BELOW: -50"
      rewards:
        - "dw skill unlock %player% terrain_traversal"
        - "dw item give %player% climbing_pickaxe 1"

  # 3. 생태 조사관 (Bio-Surveyor)
  bio_surveyor:
    icon: OAK_SAPLING
    tier_1:
      display_name: "&a[생태] &f식생 조사"
      description:
        - "&7다양한 묘목과 꽃을 수집하세요."
      type: COLLECT # Check inventory? Or item pickup
      target: 
        - OAK_SAPLING
        - SPRUCE_SAPLING
        - BIRCH_SAPLING
        - JUNGLE_SAPLING
        - DANDELION
        - POPPY
        - BLUE_ORCHID
        - ALLIUM
        - AZURE_BLUET
      amount: 9
      rewards:
        - "money give %player% 200"
        - "dw item give %player% botanist_shears 1"
    tier_2:
      display_name: "&a[생태] &f바이옴 수집가"
      description:
        - "&7다양한 기후의 바이옴을 방문하세요."
      type: VISIT_BIOME
      target: 
        - DESERT # Dry
        - JUNGLE # Wet
        - SNOWY_TAIGA # Cold
      amount: 3
      rewards:
        - "money give %player% 800"
        - "give %player% glass_bottle 5"

  # 4. 문명의 흔적 (Landmark)
  landmark_scout:
    icon: SPYGLASS
    tier_1:
      display_name: "&e[발견] &f이웃 방문"
      description:
        - "&7야생의 마을을 찾아내세요."
      type: DISCOVER_STRUCTURE
      target: VILLAGE
      amount: 1
      rewards:
        - "money give %player% 300"
        - "give %player% emerald 10"
    tier_2:
      display_name: "&e[발견] &c위험한 정찰"
      description:
        - "&7약탈자 전초기지를 정찰하세요."
      type: DISCOVER_STRUCTURE
      target: PILLAGER_OUTPOST
      amount: 1
      rewards:
        - "money give %player% 600"
        - "give %player% spyglass 1"

  # 5. 특송 배달 (Courier)
  courier:
    icon: CHEST_MINECART
    tier_1:
      display_name: "&6[배달] &f조간 신문"
      description:
        - "&7타운 우체부에게 의뢰를 받아 배달하세요."
        - "&f제한시간: &c3분"
      type: DELIVERY_MISSION
      target: TOWN_NPC_B
      amount: 1
      conditions:
        - "TIME_LIMIT: 180" # Seconds
        - "NO_TELEPORT"
      rewards:
        - "money give %player% 300"
        - "give %player% potion{Potion:swiftness} 1"
      next_mission: courier_tier_2
    tier_2:
      display_name: "&6[배달] &f로켓 배송"
      description:
        - "&7은둔자의 오두막까지 배달하세요."
      type: DELIVERY_MISSION
      target: HERMIT_HUT
      amount: 1
      conditions:
        - "TIME_LIMIT: 600"
        - "NO_ELYTRA"
      rewards:
        - "money give %player% 1500"
        - "dw item give %player% horse_whistle 1"

  # 6. 전설 (Legend)
  legend_explorer:
    icon: COMPASS
    tier_1:
      display_name: "&d[전설] &f콜럼버스"
      description:
        - "&7세계의 7대 불가사의를 모두 방문하세요."
      type: VISIT_BIOME
      target: 
        - MUSHROOM_FIELDS
        - BADLANDS
        - ICE_SPIKES
        - JUNGLE
        - MANGROVE_SWAMP
        - CHERRY_GROVE
        - WARM_OCEAN
      amount: 7
      rewards:
        - "money give %player% 100000"
        - "lp user %player% parent add title_national_geographic"
