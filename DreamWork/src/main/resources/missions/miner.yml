    tier_2:
      display_name: "&f[광부] &6검은 보석"
      description:
        - "&7더 많은 열기가 필요합니다."
        - "&7깊은 곳의 석탄은 더 오래 탄다고 합니다."
        - "&f목표: &7석탄 광석 &e500개"
