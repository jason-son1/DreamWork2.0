# ============================================
#        스토리 미션 설정 파일
# ============================================
# 연계 미션 (한 번만 완료 가능)

# ========== 광부 스토리 라인 ==========
miner_story_01:
  display_name: "&6⛏ [1장] 광부의 시작"
  description: "석탄을 채굴하여 광부로서의 첫 발을 내딛으세요."
  type: BREAK
  target:
    - coal_ore
    - deepslate_coal_ore
  amount: 10
  rewards:
    money: 20
    job_exp:
      miner: 50
    items:
      - pickaxe_apprentice
  next_mission: miner_story_02
  reset_cycle: ONE_TIME

miner_story_02:
  display_name: "&6⛏ [2장] 철의 시대"
  description: "더 단단한 철광석을 찾아 채굴하세요."
  type: BREAK
  target:
    - iron_ore
    - deepslate_iron_ore
  amount: 30
  conditions:
    - "completed:miner_story_01"
  rewards:
    money: 100
    job_exp:
      miner: 200
  next_mission: miner_story_03
  reset_cycle: ONE_TIME

miner_story_03:
  display_name: "&6⛏ [3장] 깊은 곳으로"
  description: "다이아몬드 광석을 발견하세요."
  type: BREAK
  target:
    - diamond_ore
    - deepslate_diamond_ore
  amount: 5
  conditions:
    - "completed:miner_story_02"
    - "job_level:miner:10"
  rewards:
    money: 300
    job_exp:
      miner: 500
    items:
      - pickaxe_journeyman
  next_mission: miner_story_04
  reset_cycle: ONE_TIME

miner_story_04:
  display_name: "&6⛏ [최종장] 미지의 광석"
  description: "전설의 미지의 광석을 3개 발견하세요."
  type: BREAK
  target:
    - diamond_ore
    - deepslate_diamond_ore
    - emerald_ore
    - deepslate_emerald_ore
  amount: 50
  conditions:
    - "completed:miner_story_03"
    - "job_level:miner:25"
  rewards:
    money: 1000
    job_exp:
      miner: 2000
    items:
      - pickaxe_master
      - dreamstone
  reset_cycle: ONE_TIME

