# 대장장이 대화 스크립트
blacksmith:
  start: "greeting"
  nodes:
    greeting:
      speaker: "대장장이"
      text: "&f오, 손님이 오셨군. 무슨 일로 찾아왔나?"
      options:
        - text: "대장간을 이용하고 싶습니다."
          action: "OPEN_GUI:forge"
        - text: "오늘 할 일이 있습니까?"
          next: "quest_check"
        - text: "그냥 인사하러 왔어요."
          next: "farewell"
    quest_check:
      speaker: "대장장이"
      text: "&f음... 광석이 좀 필요하긴 한데."
      options:
        - text: "무엇을 가져다 드릴까요?"
          next: "quest_offer"
        - text: "다음에 도와드릴게요."
          next: "farewell"
    quest_offer:
      speaker: "대장장이"
      text: "&e철광석 10개&f만 가져다주면 &e보수&f를 주지."
      options:
        - text: "[수락] 알겠습니다!"
          action: "ACCEPT_MISSION:blacksmith_iron"
        - text: "생각해보겠습니다."
          next: "farewell"
    farewell:
      speaker: "대장장이"
      text: "&f그래, 또 오게나. 좋은 장비가 필요하면 언제든 찾아오게."
      options: []
