# 탐험가 (Adventurer) 설정 파일
# Plan based on 탐험가 변경.md

level-up-curve: "level * 100 + 50"

# 1. 경험치 및 보상 테이블
rewards:
  # Action: [Exp, Money]
  new_chunk: {exp: 0.5, money: 0.1} # Per chunk (Check implementation for spam prevention)
  
  # Biome Discovery (One time per type?)
  rare_biome: 
    exp: 10.0
    money: 5.0
    biomes: [MUSHROOM_FIELDS, JUNGLE, BADLANDS, DEEP_DARK, CHERRY_GROVE]
    
  # Structure Discovery (One time per instance)
  structure:
    exp: 50.0
    money: 30.0
    
  # Map Crafting
  map_craft: {exp: 5.0, money: 2.0}

# 2. 스킬 설정
skills:
  pathfinder:
    # Speed Boost Blocks
    level_10: 
      blocks: [GRASS_PATH, DIRT_PATH, SHORT_GRASS, FERN] 
      speed: 0.1 # WalkSpeed +10% (0.2 base -> 0.22)
    level_30:
      blocks: [SAND, RED_SAND, SNOW, SNOW_BLOCK, GRAVEL]
      speed: 0.15
    level_50:
      speed: 0.20
      fall_reduction: 0.20 # -20% Dmg
      sneak_fall_cancel: true

  sixth_sense:
    level_20: {range: 30, interval: 1200} # 60s
    level_50: {range: 50, interval: 1200}
    
  recall:
    # Cooldown in seconds
    cooldowns:
      10: 3600 # 1h
      30: 1800 # 30m
      50: 600 # 10m
    cast_time:
      10: 10
      30: 7
      50: 5

# 3. 아이템
items:
  recall_stone:
    name: "&b귀환석"
  coordinate_scroll:
    name: "&e좌표 스크롤"
  biome_capsule:
    name: "&a바이옴 캡슐"
    allowed_biomes: [JUNGLE, BADLANDS, CHERRY_GROVE, MUSHROOM_FIELDS]
