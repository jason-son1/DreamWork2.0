# 사냥꾼 (Hunter) 설정 파일
# Plan based on 사냥꾼 변경.md

level-up-curve: "level * 100 + 50"

# 1. 경험치 및 보상 테이블
# 대상: [경험치, 돈]
rewards:
  # Tier 1
  zombie: {exp: 2.0, money: 1.0}
  spider: {exp: 2.0, money: 1.0}
  drowned: {exp: 2.0, money: 1.0}
  husk: {exp: 2.0, money: 1.0}

  # Tier 2
  skeleton: {exp: 4.0, money: 2.0}
  creeper: {exp: 4.0, money: 2.0}
  cave_spider: {exp: 4.0, money: 2.0}
  
  # Tier 3 (Nether/End)
  enderman: {exp: 10.0, money: 5.0}
  blaze: {exp: 10.0, money: 5.0}
  wither_skeleton: {exp: 10.0, money: 5.0}
  
  # Elite (Bonus)
  elite_mob: {exp: 50.0, money: 30.0}
  
  # Boss
  wither: {exp: 200.0, money: 500.0}
  warden: {exp: 200.0, money: 500.0}
  ender_dragon: {exp: 200.0, money: 500.0}

# 2. 스킬 설정
skills:
  vital_strike: # 약점 간파
    levels:
      10: {chance: 0.05, multiplier: 1.2} # 5% Crit, 1.2x Dmg
      30: {chance: 0.10, multiplier: 1.5, knockback: true}
      50: {chance: 0.15, multiplier: 2.0, speed_buff: true}
  
  tracking: # 추적
    levels:
      1: {range: 20}
      20: {range: 50}
      50: {range: 100}

# 3. 아이템 및 확률
items:
  elite_spawn_chance: 0.01 # 1% (Nature spawn only)
  
  taming_collar:
    allowed_mobs:
      - SPIDER
      - CAVE_SPIDER
      - POLAR_BEAR
    success_chance: 0.3
    
# 4. 도감 보너스 (Knowledge)
knowledge:
  # Kills requirement
  tier_1: {kills: 100, dmg_increase: 0.05} # +5% Dmg
  tier_2: {kills: 500, dmg_received_reduction: 0.10} # -10% Dmg taken
  tier_3: {kills: 1000, reward_multiplier: 1.2} # +20% Exp/Money
