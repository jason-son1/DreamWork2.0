# 어부 (Fisher) 설정 파일
# Plan/직업/어부 변경.md 및 세부 테이블.md 기반

level-up-curve: "level * 100 + 50"

# 1. 경험치 및 보상 테이블
rewards:
  # Tier 1 (기본 어종)
  cod:
    exp: 1.0
    money: 0.5
  salmon:
    exp: 1.0
    money: 0.5
    
  # Tier 2 (특수/열대)
  pufferfish:
    exp: 3.0
    money: 2.0
  tropical_fish:
    exp: 3.0
    money: 2.0
    
  # Tier 3 (대형 어종) - 크릴 미끼 필요
  tuna:
    exp: 10.0
    money: 15.0
  king_salmon:
    exp: 10.0
    money: 15.0
    
  # Special
  treasure:
    exp: 50.0
    money: 100.0
    
  # Waste
  trash:
    exp: 0.1
    money: 0.0

# 2. 스킬 설정
skills:
  sensitivity:
    levels:
      10:
        wait_reduction: 0.05 # 5% (Not easily implemented without NMS, maybe unused)
      30:
        wait_reduction: 0.15
        trash_reduction: true
      50:
        wait_reduction: 0.30
        durability_save_chance: 0.20 # 20%
        
  fish_knowledge:
    unlock_level: 1 # 기본
    
# 3. 미끼 및 아이템
items:
  # 미끼 (Offhand에 들고 사용)
  baits:
    worm:
      name: "지렁이"
      effect: "fast_bite" # 입질 단축
      bonus: 0.0
    shiny_lure:
      name: "반짝이는 루어"
      effect: "treasure" # 보물 확률 증가
      bonus: 0.2
    krill:
      name: "크릴 새우"
      effect: "tier_3" # 대형 어종 등장
      bonus: 1.0 # 필수
      
# 4. 물고기 테이블 (Custom Fish)
fish_table:
  tuna:
    base_material: COD
    display_name: "&b참다랑어"
    min_size: 50.0
    max_size: 150.0
    bait_required: "krill"
    chance: 0.05 # 5%
    
  king_salmon:
    base_material: SALMON
    display_name: "&6대왕 연어"
    min_size: 80.0
    max_size: 200.0
    bait_required: "krill"
    chance: 0.05

# 5. 바이옴 및 기타
settings:
  big_catch_multiplier: 2.0 # 월척 보상 2배
  live_fish_price_multiplier: 2.5 # 살아있는 물고기 가격 배수
